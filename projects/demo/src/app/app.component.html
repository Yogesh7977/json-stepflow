<div class="demo-wrapper">
  <h1>json-stepflow Demo</h1>
  <p class="subtitle">Convert JSON data into responsive step-flow visualizations</p>

  <section class="demo-section">
    <h2>Customer Onboarding Pipeline</h2>
    <jsf-step-flow [phases]="onboardingPhases"></jsf-step-flow>
  </section>

  <section class="demo-section">
    <h2>Custom Styled Flow</h2>
    <jsf-step-flow [phases]="customPhases" [config]="customConfig"></jsf-step-flow>
  </section>
</div>
